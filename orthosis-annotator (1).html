<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orthosis Scan Annotator – Eqwal Ability</title>
<style>
  :root {
    --navy:     #1B3A5C;
    --navy-lt:  #EBF0F6;
    --navy-md:  #4A7AA8;
    --gold:     #C9A84C;
    --gold-lt:  #FBF5E6;
    --red:      #C53030;
    --green:    #276749;
    --amber:    #B7791F;
    --grey-0:   #F5F6F8;
    --grey-1:   #E4E8ED;
    --grey-2:   #C2CAD4;
    --grey-3:   #7F8FA0;
    --grey-4:   #3D4F61;
    --grey-5:   #1A2533;
    --white:    #FFFFFF;
    --sidebar-w: 262px;
    --notes-w:   300px;
    --toolbar-h: 56px;
    --radius:    6px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--grey-0);
    color: var(--grey-5);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* TOPBAR */
  #topbar {
    height: var(--toolbar-h);
    background: var(--navy);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 10px;
    flex-shrink: 0;
    z-index: 100;
  }
  #topbar img.logo { height: 32px; margin-right: 10px; }
  #topbar .divider { width: 1px; height: 28px; background: rgba(255,255,255,.2); margin: 0 4px; }

  .tb-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 13px;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: var(--radius);
    background: rgba(255,255,255,.1);
    color: #fff;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s, border-color .15s;
    white-space: nowrap;
  }
  .tb-btn:hover { background: rgba(255,255,255,.2); border-color: rgba(255,255,255,.4); }
  .tb-btn.gold { background: var(--gold); border-color: var(--gold); color: var(--navy); font-weight: 700; }
  .tb-btn.gold:hover { background: #b8963e; }

  #topbar .spacer { flex: 1; }
  #file-info { font-size: 12px; color: rgba(255,255,255,.55); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* MAIN */
  #main { flex: 1; display: flex; overflow: hidden; }

  /* LEFT SIDEBAR */
  #sidebar {
    width: var(--sidebar-w);
    background: var(--white);
    border-right: 1px solid var(--grey-1);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow-y: auto;
  }
  .section-title {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .08em; color: var(--grey-3);
    padding: 14px 14px 6px;
  }
  .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 10px 10px; }
  .tool-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 10px 6px;
    border: 1.5px solid var(--grey-1);
    border-radius: var(--radius);
    background: var(--white);
    color: var(--grey-4);
    font-size: 11px; font-weight: 500;
    cursor: pointer; transition: all .15s;
  }
  .tool-btn:hover { border-color: var(--navy-md); color: var(--navy); background: var(--navy-lt); }
  .tool-btn.active { border-color: var(--navy); background: var(--navy-lt); color: var(--navy); }
  .tool-btn svg { width: 22px; height: 22px; }

  .color-row { display: flex; align-items: center; gap: 8px; padding: 4px 12px 10px; flex-wrap: wrap; }
  .color-swatch {
    width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; transition: border-color .15s, transform .1s;
  }
  .color-swatch:hover, .color-swatch.active { border-color: var(--grey-5); transform: scale(1.15); }

  .slider-row { padding: 2px 12px 12px; display: flex; flex-direction: column; gap: 4px; }
  .slider-row label { font-size: 11px; color: var(--grey-3); display: flex; justify-content: space-between; }
  .slider-row input[type=range] { width: 100%; accent-color: var(--navy); }

  /* VIEWPORT */
  #viewport { flex: 1; position: relative; overflow: hidden; background: #1C2535; }
  #three-canvas { display: block; width: 100%; height: 100%; }
  #draw-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  #dropzone {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; color: rgba(255,255,255,.35); pointer-events: none;
  }
  #dropzone svg { width: 64px; height: 64px; opacity: .4; }
  #dropzone p { font-size: 15px; }
  #dropzone small { font-size: 12px; opacity: .7; }

  #hint {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.6); color: #fff; font-size: 12px;
    padding: 5px 16px; border-radius: 20px;
    pointer-events: none; opacity: 0; transition: opacity .3s; white-space: nowrap;
  }
  #hint.show { opacity: 1; }

  #loading {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(28,37,53,.75); color: #fff;
    font-size: 14px; flex-direction: column; gap: 12px; z-index: 50;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid rgba(255,255,255,.2);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #pins-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }

  /* NOTES PANEL */
  #notes-panel {
    width: var(--notes-w); background: var(--white);
    border-left: 1px solid var(--grey-1);
    display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden;
  }
  #notes-header {
    padding: 12px 14px 10px; border-bottom: 1px solid var(--grey-1);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--navy-lt);
  }
  #notes-header h2 { font-size: 13px; font-weight: 700; color: var(--navy); }
  #note-count {
    background: var(--gold); color: var(--navy);
    font-size: 10px; font-weight: 700; border-radius: 10px;
    padding: 1px 7px; min-width: 20px; text-align: center;
  }
  #notes-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }

  .note-card {
    border: 1px solid var(--grey-1); border-radius: var(--radius);
    overflow: hidden; font-size: 12px; cursor: pointer;
    transition: border-color .15s, box-shadow .15s;
  }
  .note-card:hover { border-color: var(--navy-md); box-shadow: 0 0 0 3px var(--navy-lt); }
  .note-card.selected { border-color: var(--navy); box-shadow: 0 0 0 3px var(--navy-lt); }
  .note-card-header {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 10px; background: var(--grey-0); border-bottom: 1px solid var(--grey-1);
  }
  .note-color-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .note-label { font-size: 11px; font-weight: 600; color: var(--grey-4); flex: 1; }
  .note-type-badge {
    font-size: 9px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .05em; padding: 1px 6px; border-radius: 3px;
    background: var(--grey-1); color: var(--grey-3);
  }
  .note-delete { background: none; border: none; color: var(--grey-3); cursor: pointer; font-size: 16px; line-height: 1; padding: 0 2px; }
  .note-delete:hover { color: var(--red); }
  .note-card-body { padding: 8px 10px; }
  .note-text-input {
    width: 100%; border: none; background: transparent;
    font-size: 12px; color: var(--grey-5); font-family: inherit;
    resize: none; outline: none; min-height: 48px;
  }
  .note-text-input::placeholder { color: var(--grey-2); }
  .note-card-footer { padding: 4px 10px 6px; font-size: 10px; color: var(--grey-3); }

  .empty-state {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 8px; color: var(--grey-2);
    font-size: 12px; text-align: center; padding: 20px;
  }
  .empty-state svg { width: 36px; height: 36px; opacity: .5; }

  #export-area {
    padding: 10px; border-top: 1px solid var(--grey-1);
    display: flex; flex-direction: column; gap: 6px;
  }

  /* radio category labels */
  .cat-label { font-size:12px; display:flex; gap:8px; align-items:center; cursor:pointer; padding: 3px 0; }
</style>
</head>

        <path d="M32 34v8M28 38h8"/>

        <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>

      <button class="tb-btn gold" id="export-btn2" style="justify-content:center">Export HTML report</button>
      <button class="tb-btn" id="save-json-btn" style="justify-content:center;color:var(--grey-4)">Save session (.json)</button>
      <label class="tb-btn" style="cursor:pointer;justify-content:center;color:var(--grey-4)">
        Load session (.json)
        <input type="file" id="load-json-input" accept=".json" style="display:none">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

// ── State ──
let activeTool = 'orbit';
let activeColor = '#E53E3E';
let lineWidth = 3;
let annotations = [];
let selectedId = null;
let modelGroup = null;
let currentFileName = '';
let undoStack = [];
let isDrawing = false;
let drawPoints2D = [];
let drawPoints3D = [];
let measureFirst = null;

const CAT_COLORS = {cut:'#C53030', pad:'#276749', bony:'#B7791F', straps:'#C9A84C', other:'#4A5568'};
const CAT_LABELS = {cut:'Cut line', pad:'Padding zone', bony:'Bony prominence', straps:'Strap position', other:'Other'};

// ── Three.js setup ──
const canvas3 = document.getElementById('three-canvas');
const viewport = document.getElementById('viewport');
const renderer = new THREE.WebGLRenderer({ canvas: canvas3, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x1C2535);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100000);
camera.position.set(0, 0, 500);

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const dir1 = new THREE.DirectionalLight(0xffffff, 0.85);
dir1.position.set(1, 2, 2); scene.add(dir1);
const dir2 = new THREE.DirectionalLight(0x8ab4f8, 0.3);
dir2.position.set(-2, -1, -1); scene.add(dir2);

// Orbit state
let phi = Math.PI/2, theta = 0, radius = 500;
let target = new THREE.Vector3();

function updateCamera(){
  const sp = new THREE.Spherical(radius, phi, theta);
  camera.position.setFromSpherical(sp).add(target);
  camera.lookAt(target);
  camera.near = radius * 0.001;
  camera.far  = radius * 100;
  camera.updateProjectionMatrix();
}
updateCamera();

// Draw overlay
const drawCanvas = document.getElementById('draw-canvas');
const ctx2d = drawCanvas.getContext('2d');
const pinsSvg = document.getElementById('pins-svg');

// Raycaster
const raycaster = new THREE.Raycaster();
const mouse2 = new THREE.Vector2();

function getIntersects(e){
  if(!modelGroup) return [];
  const rect = canvas3.getBoundingClientRect();
  mouse2.x =  ((e.clientX - rect.left) / rect.width)  * 2 - 1;
  mouse2.y = -((e.clientY - rect.top)  / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse2, camera);
  const meshes = [];
  modelGroup.traverse(c=>{ if(c.isMesh) meshes.push(c); });
  return raycaster.intersectObjects(meshes, false);
}

// Resize
function onResize(){
  const w = viewport.clientWidth, h = viewport.clientHeight;
  renderer.setSize(w, h, false);
  const dpr = window.devicePixelRatio;
  drawCanvas.width  = w * dpr;
  drawCanvas.height = h * dpr;
  drawCanvas.style.width  = w + 'px';
  drawCanvas.style.height = h + 'px';
  ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  updatePinPositions();
}
window.addEventListener('resize', onResize);
onResize();

// Render loop
(function render(){ requestAnimationFrame(render); renderer.render(scene, camera); updatePinPositions(); })();

// ── OBJ Parser (handles v x y z r g b  and  f p//n syntax) ──
function parseOBJ(text){
  const positions=[], normals=[], vertColors=[];
  const verts=[], cols=[], norms=[];

  const lines = text.split(/\r?\n/);
  for(let i=0;i<lines.length;i++){
    const line=lines[i].trim();
    if(!line||line[0]==='#') continue;
    const p=line.split(/\s+/);
    if(p[0]==='v'){
      positions.push(parseFloat(p[1]),parseFloat(p[2]),parseFloat(p[3]));
      // vertex color (optional 4th-6th fields, 0-1 range)
      if(p.length>=7){
        vertColors.push(parseFloat(p[4]),parseFloat(p[5]),parseFloat(p[6]));
      } else {
        vertColors.push(0.7,0.7,0.7);
      }
    } else if(p[0]==='vn'){
      normals.push(parseFloat(p[1]),parseFloat(p[2]),parseFloat(p[3]));
    } else if(p[0]==='f'){
      // triangulate polygon (fan), each token: v, v/t, v//n, v/t/n
      const toks=p.slice(1);
      for(let j=1;j<toks.length-1;j++){
        [toks[0],toks[j],toks[j+1]].forEach(tok=>{
          const parts=tok.split('/');
          const vi=(parseInt(parts[0])-1);
          const ni=parts[2]?parseInt(parts[2])-1:-1;
          const base=vi*3;
          verts.push(positions[base],positions[base+1],positions[base+2]);
          cols.push(vertColors[base],vertColors[base+1],vertColors[base+2]);
          if(ni>=0 && normals.length>0){
            const nb=ni*3;
            norms.push(normals[nb],normals[nb+1],normals[nb+2]);
          }
        });
      }
    }
  }

  const geom=new THREE.BufferGeometry();
  geom.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
  geom.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
  if(norms.length===verts.length){
    geom.setAttribute('normal',new THREE.Float32BufferAttribute(norms,3));
  } else {
    geom.computeVertexNormals();
  }
  const mat=new THREE.MeshPhongMaterial({
    vertexColors: true,
    side: THREE.DoubleSide,
    shininess: 35
  });
  const mesh=new THREE.Mesh(geom,mat);
  const grp=new THREE.Group(); grp.add(mesh); return grp;
}

// ── STL Parser ──
function parseSTL(buffer){
  function isBin(buf){
    const dv=new DataView(buf);
    const n=dv.getUint32(80,true);
    return buf.byteLength===(84+n*50);
  }
  function binParse(buf){
    const dv=new DataView(buf), n=dv.getUint32(80,true);
    const verts=new Float32Array(n*9), nrms=new Float32Array(n*9);
    let o=84;
    for(let i=0;i<n;i++){
      const nx=dv.getFloat32(o,true),ny=dv.getFloat32(o+4,true),nz=dv.getFloat32(o+8,true); o+=12;
      for(let j=0;j<3;j++){
        const vi=(i*3+j)*3;
        verts[vi]=dv.getFloat32(o,true); verts[vi+1]=dv.getFloat32(o+4,true); verts[vi+2]=dv.getFloat32(o+8,true);
        nrms[vi]=nx; nrms[vi+1]=ny; nrms[vi+2]=nz; o+=12;
      }
      o+=2;
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
    g.setAttribute('normal',new THREE.Float32BufferAttribute(nrms,3));
    return g;
  }
  function ascParse(text){
    const verts=[];
    const re=/vertex\s+([\d.eE+\-]+)\s+([\d.eE+\-]+)\s+([\d.eE+\-]+)/g;
    let m;
    while((m=re.exec(text))!==null) verts.push(parseFloat(m[1]),parseFloat(m[2]),parseFloat(m[3]));
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
    g.computeVertexNormals(); return g;
  }
  const bin=isBin(buffer);
  const geom=bin?binParse(buffer):ascParse(new TextDecoder().decode(buffer));
  const mat=new THREE.MeshPhongMaterial({color:0xb0bec5,side:THREE.DoubleSide,shininess:40});
  const grp=new THREE.Group(); grp.add(new THREE.Mesh(geom,mat)); return grp;
}

// ── PLY Parser ──
function parsePLY(buffer){
  const text=new TextDecoder().decode(buffer);
  const he=text.indexOf('end_header\n');
  if(he<0) throw new Error('Invalid PLY');
  const header=text.substring(0,he);
  const nv=parseInt((header.match(/element vertex (\d+)/)||[])[1]||'0');
  const nf=parseInt((header.match(/element face (\d+)/)||[])[1]||'0');
  const lines=text.substring(he+11).split('\n');
  const pos=[];
  for(let i=0;i<nv;i++){
    const p=lines[i].trim().split(/\s+/);
    pos.push(parseFloat(p[0]),parseFloat(p[1]),parseFloat(p[2]));
  }
  const verts=[];
  for(let i=nv;i<nv+nf;i++){
    const p=lines[i].trim().split(/\s+/), n=parseInt(p[0]);
    for(let j=1;j<n-1;j++){
      [0,j,j+1].forEach(k=>{ const vi=parseInt(p[k+1])*3; verts.push(pos[vi],pos[vi+1],pos[vi+2]); });
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
  g.computeVertexNormals();
  const grp=new THREE.Group();
  grp.add(new THREE.Mesh(g,new THREE.MeshPhongMaterial({color:0xb0bec5,side:THREE.DoubleSide})));
  return grp;
}

// ── File loading ──
document.getElementById('file-input').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  loadFile(f); e.target.value='';
});
viewport.addEventListener('dragover',e=>e.preventDefault());
viewport.addEventListener('drop',e=>{ e.preventDefault(); const f=e.dataTransfer.files[0]; if(f) loadFile(f); });

function loadFile(file){
  const ext=file.name.split('.').pop().toLowerCase();
  showLoading(true);
  currentFileName=file.name;
  document.getElementById('file-info').textContent=file.name;
  document.getElementById('dropzone').style.display='none';
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      let grp;
      if(ext==='obj') grp=parseOBJ(new TextDecoder().decode(ev.target.result));
      else if(ext==='stl') grp=parseSTL(ev.target.result);
      else if(ext==='ply') grp=parsePLY(ev.target.result);
      else { alert('Unsupported: '+ext); showLoading(false); return; }
      setModel(grp);
    }catch(err){ console.error(err); alert('Could not load: '+err.message); }
    showLoading(false);
  };
  reader.readAsArrayBuffer(file);
}

function setModel(grp){
  if(modelGroup) scene.remove(modelGroup);
  modelGroup=grp;
  // Centre + fit
  const box=new THREE.Box3().setFromObject(grp);
  const centre=box.getCenter(new THREE.Vector3());
  const size=box.getSize(new THREE.Vector3());
  const maxDim=Math.max(size.x,size.y,size.z);
  grp.position.sub(centre);
  scene.add(grp);
  // Camera distance: fit entire model in view
  const fov=camera.fov*(Math.PI/180);
  radius = (maxDim/2)/Math.tan(fov/2)*1.8;
  phi=Math.PI/2; theta=0; target.set(0,0,0);
  updateCamera();
  showHint('Model loaded — Orbit to rotate, then pick a tool.');
}

// Wireframe + vertex colour toggles
document.getElementById('show-wireframe').addEventListener('change',e=>{
  if(!modelGroup) return;
  modelGroup.traverse(c=>{ if(c.isMesh) c.material.wireframe=e.target.checked; });
});
document.getElementById('show-vertex-colors').addEventListener('change',e=>{
  if(!modelGroup) return;
  modelGroup.traverse(c=>{
    if(c.isMesh){
      c.material.vertexColors=e.target.checked;
      if(!e.target.checked) c.material.color.set(0xb0bec5);
      else c.material.color.set(0xffffff);
      c.material.needsUpdate=true;
    }
  });
});

// ── Orbit controls ──
let orb={active:false,btn:0,lx:0,ly:0};
canvas3.addEventListener('mousedown',onDown);
canvas3.addEventListener('mousemove',onMove);
canvas3.addEventListener('mouseup',onUp);
canvas3.addEventListener('contextmenu',e=>e.preventDefault());
canvas3.addEventListener('wheel',e=>{
  e.preventDefault();
  radius*=(1+e.deltaY*0.001);
  radius=Math.max(1,Math.min(1e6,radius));
  updateCamera();
},{passive:false});

function onDown(e){
  if(activeTool==='orbit'){
    orb.active=true; orb.btn=e.button; orb.lx=e.clientX; orb.ly=e.clientY;
    canvas3.style.cursor='grabbing'; return;
  }
  if(activeTool==='draw'){
    const hits=getIntersects(e); if(!hits.length) return;
    isDrawing=true;
    const rect=viewport.getBoundingClientRect();
    drawPoints2D=[{x:e.clientX-rect.left,y:e.clientY-rect.top}];
    drawPoints3D=[hits[0].point.clone()];
    e.preventDefault(); return;
  }
  if(activeTool==='pin'){
    const hits=getIntersects(e); if(!hits.length) return;
    placePin(hits[0].point.clone()); return;
  }
  if(activeTool==='measure'){
    const hits=getIntersects(e); if(!hits.length) return;
    if(!measureFirst){ measureFirst=hits[0].point.clone(); showHint('Click second point to finish measure.'); }
    else { placeMeasure(measureFirst,hits[0].point.clone()); measureFirst=null; }
  }
}

function onMove(e){
  if(activeTool==='orbit'&&orb.active){
    const dx=e.clientX-orb.lx, dy=e.clientY-orb.ly;
    orb.lx=e.clientX; orb.ly=e.clientY;
    if(orb.btn===0){
      theta-=dx*0.008; phi-=dy*0.008;
      phi=Math.max(0.05,Math.min(Math.PI-0.05,phi));
    } else if(orb.btn===2){
      const right=new THREE.Vector3().crossVectors(
        camera.getWorldDirection(new THREE.Vector3()),camera.up).normalize();
      target.addScaledVector(right,-dx*0.003*radius);
      target.addScaledVector(camera.up,dy*0.003*radius);
    }
    updateCamera(); return;
  }
  if(activeTool==='draw'&&isDrawing){
    const hits=getIntersects(e);
    const rect=viewport.getBoundingClientRect();
    const px=e.clientX-rect.left, py=e.clientY-rect.top;
    drawPoints2D.push({x:px,y:py});
    if(hits.length) drawPoints3D.push(hits[0].point.clone());
    ctx2d.clearRect(0,0,drawCanvas.clientWidth,drawCanvas.clientHeight);
    ctx2d.beginPath();
    ctx2d.strokeStyle=activeColor; ctx2d.lineWidth=lineWidth;
    ctx2d.lineCap='round'; ctx2d.lineJoin='round';
    drawPoints2D.forEach((p,i)=>i===0?ctx2d.moveTo(p.x,p.y):ctx2d.lineTo(p.x,p.y));
    ctx2d.stroke();
  }
}

function onUp(e){
  if(activeTool==='orbit'){ orb.active=false; canvas3.style.cursor='grab'; return; }
  if(activeTool==='draw'&&isDrawing){
    isDrawing=false;
    if(drawPoints3D.length>1) commitLine(drawPoints3D,activeColor,lineWidth);
    ctx2d.clearRect(0,0,drawCanvas.clientWidth,drawCanvas.clientHeight);
    drawPoints2D=[]; drawPoints3D=[];
  }
}

// Tool buttons
document.querySelectorAll('.tool-btn[data-tool]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    activeTool=btn.dataset.tool;
    document.querySelectorAll('.tool-btn[data-tool]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    canvas3.style.cursor=activeTool==='orbit'?'grab':'crosshair';
    if(activeTool!=='draw') isDrawing=false;
    if(activeTool!=='measure') measureFirst=null;
    const hints={orbit:'',draw:'Drag on the model to draw a line.',pin:'Click the model to place an annotation pin.',measure:'Click two points on the model to measure.'};
    showHint(hints[activeTool]||'');
  });
});

// Colour swatches
document.querySelectorAll('.color-swatch').forEach(sw=>{
  sw.addEventListener('click',()=>{
    document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('active'));
    sw.classList.add('active'); activeColor=sw.dataset.color;
  });
});

// Line width
const lwInput=document.getElementById('line-width');
lwInput.addEventListener('input',()=>{ lineWidth=parseInt(lwInput.value); document.getElementById('lw-val').textContent=lineWidth; });

// Reset cam
document.getElementById('reset-cam-btn').addEventListener('click',()=>{ phi=Math.PI/2;theta=0;target.set(0,0,0);updateCamera(); });

// Undo
document.getElementById('undo-btn').addEventListener('click',undo);
document.addEventListener('keydown',e=>{ if(e.ctrlKey&&e.key==='z') undo(); });
function undo(){
  if(!undoStack.length) return;
  const id=undoStack.pop();
  annotations=annotations.filter(a=>a.id!==id);
  removeFromScene(id); renderNotes();
}

// ── Annotations ──
function getCategory(){ return document.querySelector('input[name="cat"]:checked')?.value||'other'; }

function commitLine(pts,color,lw){
  const id='ann_'+Date.now(), cat=getCategory();
  const geom=new THREE.BufferGeometry().setFromPoints(pts);
  const mat=new THREE.LineBasicMaterial({color:new THREE.Color(color),linewidth:2,depthTest:false});
  const line=new THREE.Line(geom,mat); line.renderOrder=1;
  line.userData.annId=id;
  if(modelGroup) modelGroup.add(line); else scene.add(line);
  annotations.push({id,type:'line',color,lw,points3D:pts.map(p=>({x:p.x,y:p.y,z:p.z})),text:'',cat,timestamp:new Date().toLocaleString()});
  undoStack.push(id); renderNotes(); showHint('Line placed — add a note in the panel.');
}

function placePin(pt){
  const id='ann_'+Date.now(), cat=getCategory();
  const color=CAT_COLORS[cat]||activeColor;
  annotations.push({id,type:'pin',color,point3D:{x:pt.x,y:pt.y,z:pt.z},text:'',cat,timestamp:new Date().toLocaleString()});
  undoStack.push(id); renderNotes(); updatePins(); selectAnn(id);
}

function placeMeasure(p1,p2){
  const id='ann_'+Date.now();
  const dist=p1.distanceTo(p2);
  const label=dist.toFixed(1)+' mm';
  const mid=p1.clone().add(p2).multiplyScalar(0.5);
  const geom=new THREE.BufferGeometry().setFromPoints([p1,p2]);
  const mat=new THREE.LineBasicMaterial({color:0x63B3ED,linewidth:2,depthTest:false});
  const line=new THREE.Line(geom,mat); line.renderOrder=1;
  line.userData.annId=id;
  if(modelGroup) modelGroup.add(line); else scene.add(line);
  annotations.push({id,type:'measure',color:'#63B3ED',p1:{x:p1.x,y:p1.y,z:p1.z},p2:{x:p2.x,y:p2.y,z:p2.z},mid:{x:mid.x,y:mid.y,z:mid.z},label,text:label,cat:'other',timestamp:new Date().toLocaleString()});
  undoStack.push(id); renderNotes(); updatePins();
}

function removeFromScene(id){
  const rem=[];
  const search=o=>{ if(o.userData.annId===id) rem.push(o); };
  scene.traverse(search); if(modelGroup) modelGroup.traverse(search);
  rem.forEach(o=>o.parent&&o.parent.remove(o));
}

function projectPt(wp){
  const v=new THREE.Vector3(wp.x,wp.y,wp.z).project(camera);
  const rect=viewport.getBoundingClientRect();
  return {x:(v.x*.5+.5)*rect.width, y:(-v.y*.5+.5)*rect.height, behind:v.z>1};
}

function updatePins(){
  pinsSvg.innerHTML='';
  annotations.forEach(ann=>{
    let wp=null;
    if(ann.type==='pin') wp=ann.point3D;
    else if(ann.type==='measure') wp=ann.mid;
    if(!wp) return;
    const sc=projectPt(wp); if(sc.behind) return;
    const color=ann.color||'#1B3A5C';
    const sel=ann.id===selectedId;
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('transform',`translate(${sc.x},${sc.y})`);
    g.style.pointerEvents='all'; g.style.cursor='pointer';
    const outer=document.createElementNS('http://www.w3.org/2000/svg','circle');
    outer.setAttribute('r',sel?'13':'10');
    outer.setAttribute('fill',color); outer.setAttribute('fill-opacity','0.22');
    outer.setAttribute('stroke',color); outer.setAttribute('stroke-width','1.5');
    const inner=document.createElementNS('http://www.w3.org/2000/svg','circle');
    inner.setAttribute('r','5'); inner.setAttribute('fill',color);
    g.appendChild(outer); g.appendChild(inner);
    if(ann.type==='measure'){
      const tw=ann.label.length*7+10;
      const bg=document.createElementNS('http://www.w3.org/2000/svg','rect');
      bg.setAttribute('x','12'); bg.setAttribute('y','-9'); bg.setAttribute('width',tw); bg.setAttribute('height','18'); bg.setAttribute('rx','4'); bg.setAttribute('fill','rgba(0,0,0,.6)');
      const txt=document.createElementNS('http://www.w3.org/2000/svg','text');
      txt.setAttribute('x','17'); txt.setAttribute('y','5'); txt.setAttribute('fill','#fff'); txt.setAttribute('font-size','11'); txt.setAttribute('font-family','monospace'); txt.textContent=ann.label;
      g.appendChild(bg); g.appendChild(txt);
    }
    g.addEventListener('click',()=>selectAnn(ann.id));
    pinsSvg.appendChild(g);
  });
}
// alias
function updatePinPositions(){ updatePins(); }

// ── Notes panel ──
function renderNotes(){
  const list=document.getElementById('notes-list');
  const empty=document.getElementById('empty-state');
  document.getElementById('note-count').textContent=annotations.length;
  [...list.querySelectorAll('.note-card')].forEach(n=>n.remove());
  if(!annotations.length){ empty.style.display='flex'; return; }
  empty.style.display='none';
  const typeIcon={pin:'📍',line:'✏️',measure:'📏'};
  annotations.forEach(ann=>{
    const card=document.createElement('div');
    card.className='note-card'+(ann.id===selectedId?' selected':'');
    card.dataset.id=ann.id;
    const color=ann.color||CAT_COLORS[ann.cat]||'#888';
    card.innerHTML=`
      <div class="note-card-header">
        <div class="note-color-dot" style="background:${color}"></div>
        <span class="note-label">${CAT_LABELS[ann.cat]||'Note'}</span>
        <span class="note-type-badge">${typeIcon[ann.type]||'•'} ${ann.type}</span>
        <button class="note-delete" data-del="${ann.id}">×</button>
      </div>
      <div class="note-card-body">
        <textarea class="note-text-input" placeholder="Add note for designer…" data-id="${ann.id}">${ann.text||''}</textarea>
      </div>
      <div class="note-card-footer">${ann.timestamp}</div>`;
    card.querySelector('.note-text-input').addEventListener('input',e=>{
      const a=annotations.find(x=>x.id===e.target.dataset.id);
      if(a) a.text=e.target.value;
    });
    card.querySelector('.note-delete').addEventListener('click',e=>{
      e.stopPropagation();
      const id=e.currentTarget.dataset.del;
      annotations=annotations.filter(a=>a.id!==id);
      undoStack=undoStack.filter(x=>x!==id);
      removeFromScene(id);
      if(selectedId===id) selectedId=null;
      renderNotes(); updatePins();
    });
    card.addEventListener('click',()=>selectAnn(ann.id));
    list.appendChild(card);
  });
}

function selectAnn(id){
  selectedId=id; renderNotes(); updatePins();
  const card=document.querySelector('.note-card[data-id="'+id+'"]');
  if(card) card.scrollIntoView({behavior:'smooth',block:'nearest'});
}

<style>body{font-family:system-ui,sans-serif;margin:0;color:#1A2533}.header{background:#1B3A5C;padding:20px 32px;display:flex;align-items:center;gap:16px}.header img{height:36px}.header div{color:#fff}.header h1{font-size:20px;margin:0 0 2px;color:#fff}.header p{margin:0;font-size:12px;opacity:.7;color:#fff}.section{padding:20px 32px}h2{font-size:14px;font-weight:700;color:#1B3A5C;border-bottom:2px solid #EBF0F6;padding-bottom:6px;margin:0 0 12px}img.scan{max-width:100%;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.15)}table{width:100%;border-collapse:collapse;font-size:13px}th{background:#EBF0F6;color:#1B3A5C;font-weight:600;padding:8px 12px;text-align:left}td{padding:7px 12px;border-bottom:1px solid #E4E8ED}.footer{text-align:center;font-size:11px;color:#7F8FA0;padding:16px;border-top:1px solid #E4E8ED}</style></head>
<body><div class="header"><img src="data:image/jpeg;base64,${LOGO}" alt="Eqwal Ability"><div><h1>Orthosis Annotation Report</h1><p>${currentFileName} &nbsp;|&nbsp; ${now} &nbsp;|&nbsp; ${annotations.length} annotation(s)</p></div></div>
<div class="section"><h2>Annotated Scan</h2><img class="scan" src="${img}"></div>
<div class="section"><h2>Annotation Table</h2><table><tr><th>#</th><th>Type</th><th>Category</th><th>Note</th><th>Created</th></tr>${rows}</table></div>
<div class="footer">Eqwal Ability – Orthosis Scan Annotator</div></body></html>`;
  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='orthosis-report-'+Date.now()+'.html'; a.click();
  URL.revokeObjectURL(url);
}

document.getElementById('export-btn').addEventListener('click',doExport);
document.getElementById('export-btn2').addEventListener('click',doExport);

// ── Save/Load session ──
document.getElementById('save-json-btn').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify({fileName:currentFileName,annotations},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='session-'+Date.now()+'.json'; a.click();
  URL.revokeObjectURL(url);
});
document.getElementById('load-json-input').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      annotations=data.annotations||[];
      annotations.forEach(ann=>{
        if((ann.type==='line')&&ann.points3D){
          const pts=ann.points3D.map(p=>new THREE.Vector3(p.x,p.y,p.z));
          const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:new THREE.Color(ann.color),linewidth:2,depthTest:false}));
          line.renderOrder=1; line.userData.annId=ann.id;
          if(modelGroup) modelGroup.add(line); else scene.add(line);
        }
        if(ann.type==='measure'&&ann.p1){
          const p1=new THREE.Vector3(ann.p1.x,ann.p1.y,ann.p1.z),p2=new THREE.Vector3(ann.p2.x,ann.p2.y,ann.p2.z);
          const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([p1,p2]),new THREE.LineBasicMaterial({color:0x63B3ED,linewidth:2,depthTest:false}));
          line.renderOrder=1; line.userData.annId=ann.id;
          if(modelGroup) modelGroup.add(line); else scene.add(line);
        }
      });
      renderNotes(); updatePins();
      if(data.fileName) document.getElementById('file-info').textContent=data.fileName+' (session restored)';
    }catch(err){ alert('Could not load session: '+err.message); }
  };
  r.readAsText(f); e.target.value='';
});

// ── Hint ──
let hintTimer;
function showHint(msg){
  const el=document.getElementById('hint');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(hintTimer); hintTimer=setTimeout(()=>el.classList.remove('show'),3500);
}
function showLoading(on){ document.getElementById('loading').style.display=on?'flex':'none'; }

showHint('Open a 3D scan file to get started.');
})();
</script>
