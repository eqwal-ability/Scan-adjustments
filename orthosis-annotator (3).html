<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orthosis Scan Annotator – Eqwal Ability</title>
<style>
  :root {
    --navy:#1B3A5C; --navy-lt:#EBF0F6; --navy-md:#4A7AA8;
    --gold:#C9A84C; --red:#C53030;
    --grey-0:#F5F6F8; --grey-1:#E4E8ED; --grey-2:#C2CAD4;
    --grey-3:#7F8FA0; --grey-4:#3D4F61; --grey-5:#1A2533;
    --white:#FFFFFF; --sidebar:240px; --notes:290px; --topbar:54px; --r:6px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:system-ui,-apple-system,sans-serif;background:var(--grey-0);color:var(--grey-5);height:100vh;overflow:hidden;display:flex;flex-direction:column;}
  #topbar{height:var(--topbar);background:var(--navy);display:flex;align-items:center;padding:0 14px;gap:8px;flex-shrink:0;}
  #topbar img.logo{height:30px;margin-right:8px;}
  .divider{width:1px;height:26px;background:rgba(255,255,255,.18);margin:0 2px;}
  .tb-btn{display:flex;align-items:center;gap:5px;padding:5px 12px;border:1px solid rgba(255,255,255,.22);border-radius:var(--r);background:rgba(255,255,255,.1);color:#fff;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s;}
  .tb-btn:hover{background:rgba(255,255,255,.2);}
  .tb-btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:700;}
  .tb-btn.gold:hover{background:#b8963e;}
  label.tb-btn{cursor:pointer;}
  #file-info{font-size:12px;color:rgba(255,255,255,.5);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .spacer{flex:1;}
  #main{flex:1;display:flex;overflow:hidden;}
  #sidebar{width:var(--sidebar);background:var(--white);border-right:1px solid var(--grey-1);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;}
  .sec{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--grey-3);padding:14px 12px 6px;}
  .tool-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 10px 10px;}
  .tool-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;border:1.5px solid var(--grey-1);border-radius:var(--r);background:var(--white);color:var(--grey-4);font-size:11px;font-weight:500;cursor:pointer;transition:all .15s;}
  .tool-btn svg{width:20px;height:20px;}
  .tool-btn:hover{border-color:var(--navy-md);color:var(--navy);background:var(--navy-lt);}
  .tool-btn.active{border-color:var(--navy);background:var(--navy-lt);color:var(--navy);}
  .color-row{display:flex;align-items:center;gap:7px;padding:4px 12px 12px;}
  .swatch{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:transform .1s,border-color .1s;flex-shrink:0;}
  .swatch:hover{transform:scale(1.15);}
  .swatch.active{border-color:var(--grey-5);transform:scale(1.1);}
  .slider-row{padding:2px 12px 14px;display:flex;flex-direction:column;gap:4px;}
  .slider-row label{font-size:11px;color:var(--grey-3);display:flex;justify-content:space-between;}
  .slider-row input[type=range]{width:100%;accent-color:var(--navy);}
  .view-checks{padding:0 12px 12px;display:flex;flex-direction:column;gap:6px;}
  .view-checks label{font-size:12px;display:flex;gap:8px;align-items:center;cursor:pointer;}
  .sidebar-foot{padding:10px 12px;font-size:10px;color:var(--grey-3);line-height:1.6;border-top:1px solid var(--grey-1);margin-top:auto;}
  #viewport{flex:1;position:relative;overflow:hidden;background:#1C2535;}
  #three-canvas{display:block;width:100%;height:100%;}
  #lines-svg,#pins-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;}
  #dropzone{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:rgba(255,255,255,.3);pointer-events:none;}
  #dropzone svg{width:60px;height:60px;opacity:.35;}
  #dropzone p{font-size:15px;}
  #dropzone small{font-size:12px;opacity:.7;}
  #hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:5px 16px;border-radius:20px;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap;}
  #hint.show{opacity:1;}
  #loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(28,37,53,.75);color:#fff;font-size:14px;flex-direction:column;gap:12px;z-index:50;}
  .spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #notes-panel{width:var(--notes);background:var(--white);border-left:1px solid var(--grey-1);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;}
  #notes-header{padding:11px 13px;border-bottom:1px solid var(--grey-1);background:var(--navy-lt);display:flex;align-items:center;justify-content:space-between;}
  #notes-header h2{font-size:13px;font-weight:700;color:var(--navy);}
  #note-count{background:var(--gold);color:var(--navy);font-size:10px;font-weight:700;border-radius:10px;padding:1px 7px;}
  #notes-list{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px;}
  .note-card{border:1px solid var(--grey-1);border-radius:var(--r);overflow:hidden;transition:border-color .15s,box-shadow .15s;}
  .note-card:hover{border-color:var(--navy-md);}
  .note-card.selected{border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-lt);}
  .note-card-head{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--grey-0);border-bottom:1px solid var(--grey-1);}
  .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .note-idx{font-size:10px;font-weight:700;color:var(--grey-3);}
  .note-type{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:1px 5px;border-radius:3px;background:var(--grey-1);color:var(--grey-3);margin-left:auto;}
  .note-del{background:none;border:none;color:var(--grey-3);cursor:pointer;font-size:16px;line-height:1;padding:0 2px;margin-left:4px;}
  .note-del:hover{color:var(--red);}
  .note-card-body{padding:7px 9px;}
  .note-ta{display:block;width:100%;border:1px solid transparent;border-radius:4px;background:transparent;font-size:12px;color:var(--grey-5);font-family:inherit;resize:none;outline:none;min-height:52px;padding:4px;cursor:text;transition:border-color .15s,background .15s;}
  .note-ta:hover{background:var(--grey-0);border-color:var(--grey-2);}
  .note-ta:focus{background:var(--white);border-color:var(--navy-md);box-shadow:0 0 0 2px var(--navy-lt);}
  .note-ta::placeholder{color:var(--grey-2);}
  .note-foot{padding:3px 9px 6px;font-size:10px;color:var(--grey-3);}
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--grey-2);font-size:12px;text-align:center;padding:30px 16px;}
  .empty-state svg{width:32px;height:32px;opacity:.4;}
  #export-area{padding:9px;border-top:1px solid var(--grey-1);display:flex;flex-direction:column;gap:5px;}
  #export-area .plain{justify-content:center;border-color:var(--grey-2);color:var(--grey-4);background:var(--white);}
  #export-area .plain:hover{background:var(--grey-0);}
</style>
</head>

      <div class="swatch" data-color="#C9A84C" style="background:#C9A84C" title="Gold"></div>
      <div class="swatch" data-color="#276749" style="background:#276749" title="Green"></div>
      <div class="swatch" data-color="#FFFFFF" style="background:#FFFFFF;border-color:var(--grey-2)" title="White"></div>
    </div>

    <div class="slider-row">
      <label>Line width <span id="lw-val">3</span> px</label>
      <input type="range" id="line-width" min="1" max="10" value="3">
    </div>

    <div class="sec" style="margin-top:2px">View</div>
    <div class="view-checks">
      <label><input type="checkbox" id="cb-wireframe"> Wireframe overlay</label>
      <label><input type="checkbox" id="cb-vcolor" checked> Vertex colours</label>
    </div>

    <div class="sidebar-foot">Supported: OBJ · STL · PLY<br>Ctrl+Z — undo last annotation</div>
  </div>

  <div id="viewport">
    <canvas id="three-canvas"></canvas>
    <svg id="lines-svg"></svg>
    <svg id="pins-svg"></svg>
    <div id="dropzone">
      <svg fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 64 64"><rect x="8" y="16" width="48" height="36" rx="4"/><path d="M8 24h48M24 16v-4a4 4 0 018 0v4"/><circle cx="32" cy="38" r="7"/><path d="M32 34v8M28 38h8"/></svg>
      <p>Open a 3D scan to begin</p>
      <small>OBJ, STL or PLY — drag &amp; drop also works</small>
    </div>
    <div id="hint"></div>
    <div id="loading"><div class="spinner"></div><span>Loading model…</span></div>
  </div>

  <div id="notes-panel">
    <div id="notes-header"><h2>Annotations</h2><span id="note-count">0</span></div>
    <div id="notes-list">
      <div class="empty-state" id="empty-state">
        <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <div>No annotations yet.</div>
        <div>Use <strong>Draw line</strong> or <strong>Add note</strong> and click the model.</div>
      </div>
    </div>
    <div id="export-area">
      <button class="tb-btn gold" id="btn-export2" style="justify-content:center">Export HTML report</button>
      <button class="tb-btn plain" id="btn-save">Save session (.json)</button>
      <label class="tb-btn plain">Load session (.json)<input type="file" id="inp-load" accept=".json" style="display:none"></label>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

(function(){
'use strict';

var tool='orbit', color='#E53E3E', lw=3;
var annotations=[], selectedId=null, model=null, fileName='', undoStack=[];
var drawing=false, stroke3D=[];

// Three.js setup
var canvas=document.getElementById('three-canvas');
var vp=document.getElementById('viewport');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x1C2535);

var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(45,1,0.1,1e6);
scene.add(new THREE.AmbientLight(0xffffff,0.55));
var dl=new THREE.DirectionalLight(0xffffff,0.85); dl.position.set(1,2,2); scene.add(dl);
var dl2=new THREE.DirectionalLight(0x8ab4f8,0.3); dl2.position.set(-2,-1,-1); scene.add(dl2);

var phi=Math.PI/2, theta=0, radius=500;
var camTarget=new THREE.Vector3();

function updateCam(){
  var sp=new THREE.Spherical(radius,phi,theta);
  camera.position.setFromSpherical(sp).add(camTarget);
  camera.lookAt(camTarget);
  camera.near=radius*0.001;
  camera.far=radius*100;
  camera.updateProjectionMatrix();
}
updateCam();

// SVG overlays
var linesSvg=document.getElementById('lines-svg');
var pinsSvg=document.getElementById('pins-svg');

function proj(wp){
  var v=new THREE.Vector3(wp.x,wp.y,wp.z).project(camera);
  var r=vp.getBoundingClientRect();
  return {x:(v.x*0.5+0.5)*r.width, y:(-v.y*0.5+0.5)*r.height, behind:v.z>1};
}

function buildD(pts){
  var d='', pen=false;
  for(var i=0;i<pts.length;i++){
    var s=proj(pts[i]);
    if(s.behind){pen=false;continue;}
    if(!pen){d+='M'+s.x.toFixed(1)+' '+s.y.toFixed(1)+' ';pen=true;}
    else{d+='L'+s.x.toFixed(1)+' '+s.y.toFixed(1)+' ';}
  }
  return d;
}

function makePath(d,col,w,opacity){
  var el=document.createElementNS('http://www.w3.org/2000/svg','path');
  el.setAttribute('d',d);
  el.setAttribute('stroke',col);
  el.setAttribute('stroke-width',w);
  el.setAttribute('stroke-linecap','round');
  el.setAttribute('stroke-linejoin','round');
  el.setAttribute('fill','none');
  el.setAttribute('opacity',opacity);
  return el;
}

function redraw(){
  linesSvg.innerHTML='';
  pinsSvg.innerHTML='';

  // Live preview stroke
  if(drawing && stroke3D.length>1){
    var d=buildD(stroke3D);
    if(d) linesSvg.appendChild(makePath(d,color,lw,0.65));
  }

  // Committed annotations
  for(var i=0;i<annotations.length;i++){
    var ann=annotations[i];
    if(ann.type==='line'){
      var d=buildD(ann.points3D);
      if(!d) continue;
      var el=makePath(d,ann.color,ann.lw,1);
      el.style.pointerEvents='stroke';
      el.style.cursor='pointer';
      (function(id){el.addEventListener('click',function(){selectAnn(id);});})(ann.id);
      linesSvg.appendChild(el);
    } else if(ann.type==='pin'){
      var s=proj(ann.point3D);
      if(s.behind) continue;
      var g=document.createElementNS('http://www.w3.org/2000/svg','g');
      g.style.pointerEvents='all';
      g.style.cursor='pointer';
      g.setAttribute('transform','translate('+s.x.toFixed(1)+','+s.y.toFixed(1)+')');
      var outer=document.createElementNS('http://www.w3.org/2000/svg','circle');
      outer.setAttribute('r',ann.id===selectedId?'13':'10');
      outer.setAttribute('fill',ann.color);
      outer.setAttribute('fill-opacity','0.2');
      outer.setAttribute('stroke',ann.color);
      outer.setAttribute('stroke-width','1.5');
      var inner=document.createElementNS('http://www.w3.org/2000/svg','circle');
      inner.setAttribute('r','5');
      inner.setAttribute('fill',ann.color);
      g.appendChild(outer); g.appendChild(inner);
      (function(id){g.addEventListener('click',function(){selectAnn(id);});})(ann.id);
      pinsSvg.appendChild(g);
    }
  }
}

// Resize
function resize(){
  var w=vp.clientWidth, h=vp.clientHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);
resize();

// Render loop
function loop(){requestAnimationFrame(loop);renderer.render(scene,camera);redraw();}
loop();

// Raycaster
var rc=new THREE.Raycaster();
var mv=new THREE.Vector2();

function getHit(e){
  if(!model) return null;
  var r=canvas.getBoundingClientRect();
  mv.x=((e.clientX-r.left)/r.width)*2-1;
  mv.y=-((e.clientY-r.top)/r.height)*2+1;
  rc.setFromCamera(mv,camera);
  var meshes=[];
  model.traverse(function(c){if(c.isMesh) meshes.push(c);});
  var hits=rc.intersectObjects(meshes,false);
  return hits.length?hits[0].point:null;
}

// OBJ parser — handles Revopoint v x y z r g b and f p//n
function parseOBJ(text){
  var pos=[], vcol=[], norm=[];
  var vA=[], cA=[], nA=[];
  var lines=text.split('\n');
  for(var i=0;i<lines.length;i++){
    var L=lines[i].trim();
    if(!L||L.charAt(0)==='#') continue;
    var p=L.split(/\s+/);
    if(p[0]==='v'){
      pos.push(parseFloat(p[1]),parseFloat(p[2]),parseFloat(p[3]));
      if(p.length>=7){
        vcol.push(parseFloat(p[4]),parseFloat(p[5]),parseFloat(p[6]));
      } else {
        vcol.push(0.7,0.7,0.7);
      }
    } else if(p[0]==='vn'){
      norm.push(parseFloat(p[1]),parseFloat(p[2]),parseFloat(p[3]));
    } else if(p[0]==='f'){
      var toks=p.slice(1);
      for(var j=1;j<toks.length-1;j++){
        var tri=[toks[0],toks[j],toks[j+1]];
        for(var k=0;k<tri.length;k++){
          var parts=tri[k].split('/');
          var vi=parseInt(parts[0])-1;
          var ni=parts[2]?parseInt(parts[2])-1:-1;
          vA.push(pos[vi*3],pos[vi*3+1],pos[vi*3+2]);
          cA.push(vcol[vi*3],vcol[vi*3+1],vcol[vi*3+2]);
          if(ni>=0&&norm.length) nA.push(norm[ni*3],norm[ni*3+1],norm[ni*3+2]);
        }
      }
    }
  }
  var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(vA,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(cA,3));
  if(nA.length>0&&nA.length===vA.length) g.setAttribute('normal',new THREE.Float32BufferAttribute(nA,3));
  else g.computeVertexNormals();
  var mat=new THREE.MeshPhongMaterial({vertexColors:true,side:THREE.DoubleSide,shininess:35});
  var grp=new THREE.Group(); grp.add(new THREE.Mesh(g,mat)); return grp;
}

// STL parser
function parseSTL(buf){
  var dv=new DataView(buf);
  var n=dv.getUint32(80,true);
  if(buf.byteLength===84+n*50){
    var vA=new Float32Array(n*9), nA=new Float32Array(n*9);
    var o=84;
    for(var i=0;i<n;i++){
      var nx=dv.getFloat32(o,true),ny=dv.getFloat32(o+4,true),nz=dv.getFloat32(o+8,true); o+=12;
      for(var j=0;j<3;j++){
        var vi=(i*3+j)*3;
        vA[vi]=dv.getFloat32(o,true); vA[vi+1]=dv.getFloat32(o+4,true); vA[vi+2]=dv.getFloat32(o+8,true);
        nA[vi]=nx; nA[vi+1]=ny; nA[vi+2]=nz; o+=12;
      }
      o+=2;
    }
    var g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(vA,3));
    g.setAttribute('normal',new THREE.Float32BufferAttribute(nA,3));
    var grp=new THREE.Group(); grp.add(new THREE.Mesh(g,new THREE.MeshPhongMaterial({color:0xb0bec5,side:THREE.DoubleSide,shininess:40}))); return grp;
  } else {
    var text=new TextDecoder().decode(buf);
    var vB=[];
    var re=/vertex\s+([\d.eE+\-]+)\s+([\d.eE+\-]+)\s+([\d.eE+\-]+)/g;
    var m;
    while((m=re.exec(text))!==null) vB.push(parseFloat(m[1]),parseFloat(m[2]),parseFloat(m[3]));
    var g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(vB,3));
    g.computeVertexNormals();
    var grp=new THREE.Group(); grp.add(new THREE.Mesh(g,new THREE.MeshPhongMaterial({color:0xb0bec5,side:THREE.DoubleSide}))); return grp;
  }
}

// PLY parser
function parsePLY(buf){
  var text=new TextDecoder().decode(buf);
  var he=text.indexOf('end_header\n');
  if(he<0) throw new Error('Invalid PLY file');
  var hdr=text.substring(0,he);
  var mV=hdr.match(/element vertex (\d+)/);
  var mF=hdr.match(/element face (\d+)/);
  var nv=mV?parseInt(mV[1]):0;
  var nf=mF?parseInt(mF[1]):0;
  var lines=text.substring(he+11).split('\n');
  var pos=[];
  for(var i=0;i<nv;i++){
    var p=lines[i].trim().split(/\s+/);
    pos.push(parseFloat(p[0]),parseFloat(p[1]),parseFloat(p[2]));
  }
  var vA=[];
  for(var i=nv;i<nv+nf;i++){
    var p=lines[i].trim().split(/\s+/);
    var fn=parseInt(p[0]);
    for(var j=1;j<fn-1;j++){
      var tri=[0,j,j+1];
      for(var k=0;k<3;k++){
        var vi=parseInt(p[tri[k]+1])*3;
        vA.push(pos[vi],pos[vi+1],pos[vi+2]);
      }
    }
  }
  var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(vA,3));
  g.computeVertexNormals();
  var grp=new THREE.Group(); grp.add(new THREE.Mesh(g,new THREE.MeshPhongMaterial({color:0xb0bec5,side:THREE.DoubleSide}))); return grp;
}

function setModel(grp){
  if(model) scene.remove(model);
  model=grp;
  var box=new THREE.Box3().setFromObject(grp);
  var centre=box.getCenter(new THREE.Vector3());
  grp.position.sub(centre);
  scene.add(grp);
  var size=box.getSize(new THREE.Vector3());
  var maxDim=Math.max(size.x,size.y,size.z);
  radius=(maxDim/2)/Math.tan(camera.fov*Math.PI/360)*1.8;
  phi=Math.PI/2; theta=0; camTarget.set(0,0,0);
  updateCam();
  hint('Model loaded — orbit to rotate, then pick a tool.');
}

// File loading
document.getElementById('file-input').addEventListener('change',function(e){
  var f=e.target.files[0]; if(!f) return;
  loadFile(f); e.target.value='';
});
vp.addEventListener('dragover',function(e){e.preventDefault();});
vp.addEventListener('drop',function(e){e.preventDefault();var f=e.dataTransfer.files[0];if(f)loadFile(f);});

function loadFile(file){
  var ext=file.name.split('.').pop().toLowerCase();
  showLoad(true);
  fileName=file.name;
  document.getElementById('file-info').textContent=file.name;
  document.getElementById('dropzone').style.display='none';
  var rd=new FileReader();
  rd.onload=function(ev){
    try{
      var grp;
      if(ext==='obj') grp=parseOBJ(new TextDecoder().decode(ev.target.result));
      else if(ext==='stl') grp=parseSTL(ev.target.result);
      else if(ext==='ply') grp=parsePLY(ev.target.result);
      else{alert('Unsupported format: '+ext);showLoad(false);return;}
      setModel(grp);
    } catch(err){
      console.error(err);
      alert('Could not load file: '+err.message);
    }
    showLoad(false);
  };
  rd.readAsArrayBuffer(file);
}

// Orbit
var orb={on:false,btn:0,x:0,y:0};
canvas.addEventListener('mousedown',onDown);
window.addEventListener('mousemove',onMove);
window.addEventListener('mouseup',onUp);
canvas.addEventListener('contextmenu',function(e){e.preventDefault();});
canvas.addEventListener('wheel',function(e){
  e.preventDefault();
  radius=Math.max(1,Math.min(1e6,radius*(1+e.deltaY*0.001)));
  updateCam();
},{passive:false});

function onDown(e){
  if(tool==='orbit'||e.button===2){
    orb={on:true,btn:e.button,x:e.clientX,y:e.clientY};
    canvas.style.cursor='grabbing';
    return;
  }
  if(tool==='draw'){
    var p=getHit(e); if(!p) return;
    drawing=true; stroke3D=[p.clone()];
    e.preventDefault(); return;
  }
  if(tool==='pin'){
    var p=getHit(e); if(!p) return;
    placePin(p.clone());
  }
}

function onMove(e){
  if(orb.on){
    var dx=e.clientX-orb.x, dy=e.clientY-orb.y;
    orb.x=e.clientX; orb.y=e.clientY;
    if(orb.btn===2||orb.btn===1){
      var right=new THREE.Vector3().crossVectors(camera.getWorldDirection(new THREE.Vector3()),camera.up).normalize();
      camTarget.addScaledVector(right,-dx*0.003*radius);
      camTarget.addScaledVector(camera.up,dy*0.003*radius);
    } else {
      theta-=dx*0.008;
      phi=Math.max(0.05,Math.min(Math.PI-0.05,phi-dy*0.008));
    }
    updateCam(); return;
  }
  if(drawing){
    var p=getHit(e); if(p) stroke3D.push(p.clone());
  }
}

function onUp(e){
  if(orb.on){
    orb.on=false;
    canvas.style.cursor=(tool==='orbit')?'grab':'crosshair';
    return;
  }
  if(drawing){
    drawing=false;
    if(stroke3D.length>1) commitLine(stroke3D.slice());
    stroke3D=[];
  }
}

// Tools
document.querySelectorAll('.tool-btn[data-tool]').forEach(function(btn){
  btn.addEventListener('click',function(){
    tool=btn.dataset.tool;
    document.querySelectorAll('.tool-btn[data-tool]').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    canvas.style.cursor=(tool==='orbit')?'grab':'crosshair';
    drawing=false; stroke3D=[];
    var tips={orbit:'',draw:'Drag on the model to draw a line.',pin:'Click the model to place a pin.'};
    hint(tips[tool]||'');
  });
});

// Swatches
document.querySelectorAll('.swatch').forEach(function(sw){
  sw.addEventListener('click',function(){
    document.querySelectorAll('.swatch').forEach(function(s){s.classList.remove('active');});
    sw.classList.add('active'); color=sw.dataset.color;
  });
});

// Line width
var lwEl=document.getElementById('line-width');
lwEl.addEventListener('input',function(){
  lw=parseInt(lwEl.value);
  document.getElementById('lw-val').textContent=lw;
});

// Reset
document.getElementById('btn-reset').addEventListener('click',function(){
  phi=Math.PI/2;theta=0;camTarget.set(0,0,0);updateCam();
});

// Undo
document.getElementById('btn-undo').addEventListener('click',undo);
document.addEventListener('keydown',function(e){if(e.ctrlKey&&e.key==='z'){e.preventDefault();undo();}});
function undo(){
  if(!undoStack.length) return;
  var id=undoStack.pop();
  annotations=annotations.filter(function(a){return a.id!==id;});
  if(selectedId===id) selectedId=null;
  renderNotes();
}

// Toggles
document.getElementById('cb-wireframe').addEventListener('change',function(e){
  if(!model) return;
  model.traverse(function(c){if(c.isMesh) c.material.wireframe=e.target.checked;});
});
document.getElementById('cb-vcolor').addEventListener('change',function(e){
  if(!model) return;
  model.traverse(function(c){
    if(c.isMesh){
      c.material.vertexColors=e.target.checked;
      c.material.color.set(e.target.checked?0xffffff:0xb0bec5);
      c.material.needsUpdate=true;
    }
  });
});

// Annotations
function commitLine(pts){
  var id='a'+Date.now();
  var stored=pts.map(function(p){return {x:p.x,y:p.y,z:p.z};});
  annotations.push({id:id,type:'line',color:color,lw:lw,points3D:stored,text:'',ts:new Date().toLocaleString()});
  undoStack.push(id);
  renderNotes();
  hint('Line drawn — add a note in the panel.');
}

function placePin(pt){
  var id='a'+Date.now();
  annotations.push({id:id,type:'pin',color:color,point3D:{x:pt.x,y:pt.y,z:pt.z},text:'',ts:new Date().toLocaleString()});
  undoStack.push(id);
  renderNotes();
  selectAnn(id);
}

// Notes panel
function renderNotes(){
  var list=document.getElementById('notes-list');
  var empty=document.getElementById('empty-state');
  document.getElementById('note-count').textContent=annotations.length;
  var cards=list.querySelectorAll('.note-card');
  for(var i=0;i<cards.length;i++) cards[i].remove();
  if(!annotations.length){empty.style.display='flex';return;}
  empty.style.display='none';

  for(var i=0;i<annotations.length;i++){
    (function(ann,idx){
      var card=document.createElement('div');
      card.className='note-card'+(ann.id===selectedId?' selected':'');
      card.dataset.id=ann.id;

      var head=document.createElement('div');
      head.className='note-card-head';
      var dotEl=document.createElement('div');
      dotEl.className='dot'; dotEl.style.background=ann.color;
      var idxEl=document.createElement('span');
      idxEl.className='note-idx'; idxEl.textContent='#'+(idx+1);
      var typeEl=document.createElement('span');
      typeEl.className='note-type'; typeEl.textContent=ann.type==='pin'?'pin':'line';
      var delBtn=document.createElement('button');
      delBtn.className='note-del'; delBtn.textContent='x'; delBtn.title='Delete';
      delBtn.addEventListener('click',function(e){
        e.stopPropagation();
        annotations=annotations.filter(function(a){return a.id!==ann.id;});
        undoStack=undoStack.filter(function(x){return x!==ann.id;});
        if(selectedId===ann.id) selectedId=null;
        renderNotes();
      });
      head.appendChild(dotEl); head.appendChild(idxEl); head.appendChild(typeEl); head.appendChild(delBtn);

      var body=document.createElement('div');
      body.className='note-card-body';
      var ta=document.createElement('textarea');
      ta.className='note-ta';
      ta.placeholder='Type a note for the designer\u2026';
      ta.value=ann.text||'';
      ta.rows=3;
      ta.addEventListener('mousedown',function(e){e.stopPropagation();});
      ta.addEventListener('click',function(e){e.stopPropagation();});
      ta.addEventListener('focus',function(e){e.stopPropagation();});
      ta.addEventListener('input',function(){
        var a=annotations.find(function(x){return x.id===ann.id;});
        if(a) a.text=ta.value;
      });
      body.appendChild(ta);

      var foot=document.createElement('div');
      foot.className='note-foot'; foot.textContent=ann.ts;

      card.appendChild(head); card.appendChild(body); card.appendChild(foot);
      card.addEventListener('click',function(){selectAnn(ann.id);});
      list.appendChild(card);
    })(annotations[i], i);
  }
}

function selectAnn(id){
  selectedId=id; renderNotes();
  var card=document.querySelector('.note-card[data-id="'+id+'"]');
  if(card) card.scrollIntoView({behavior:'smooth',block:'nearest'});
}

// Export
function doExport(){
  renderer.render(scene,camera);
  var img=canvas.toDataURL('image/png');
  var lsHTML=linesSvg.innerHTML, psHTML=pinsSvg.innerHTML;
  var W=vp.clientWidth, H=vp.clientHeight;
  var now=new Date().toLocaleString();
  var rows='';
  for(var i=0;i<annotations.length;i++){
    var a=annotations[i];
    rows+='<tr><td>'+(i+1)+'</td><td>'+(a.type==='pin'?'Pin':'Line')+'</td>'
      +'<td><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+a.color+';vertical-align:middle"></span></td>'
      +'<td>'+((a.text||'').replace(/</g,'&lt;'))+'</td>'

function dlContent(content,name,mime){
  var url=URL.createObjectURL(new Blob([content],{type:mime}));
  var a=document.createElement('a'); a.href=url; a.download=name; a.click(); URL.revokeObjectURL(url);
}

document.getElementById('btn-export').addEventListener('click',doExport);
document.getElementById('btn-export2').addEventListener('click',doExport);

document.getElementById('btn-save').addEventListener('click',function(){
  dlContent(JSON.stringify({fileName:fileName,annotations:annotations},null,2),'session-'+Date.now()+'.json','application/json');
});

document.getElementById('inp-load').addEventListener('change',function(e){
  var f=e.target.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(ev){
    try{
      var d=JSON.parse(ev.target.result);
      annotations=d.annotations||[];
      if(d.fileName) document.getElementById('file-info').textContent=d.fileName+' (session restored)';
      renderNotes();
    } catch(err){alert('Could not load session: '+err.message);}
  };
  rd.readAsText(f); e.target.value='';
});

var hintTm;
function hint(msg){
  var el=document.getElementById('hint');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(hintTm); hintTm=setTimeout(function(){el.classList.remove('show');},3500);
}
function showLoad(on){document.getElementById('loading').style.display=on?'flex':'none';}

hint('Open a 3D scan file to get started.');
})();
